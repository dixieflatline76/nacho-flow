port: 8000

# Optional Inbound Client Authentication (Dual-Layer Security)
# When set, rejects unauthorized client requests on port 8000 with HTTP 401 Unauthorized.
# Supports raw string or "ENV_NACHO_AUTH_TOKEN" for environment variable injection.
# Leave commented or empty for zero-friction local development on 127.0.0.1.
# auth_token: "ENV_NACHO_AUTH_TOKEN"

providers:
  # Local GPU Provider (Ollama / vLLM / llama.cpp)
  ollama:
    base_url: "http://127.0.0.1:11434/v1"
    type: "local"

  # OpenRouter Cloud Gateway
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: "ENV_OPENROUTER_API_KEY"
    headers:
      HTTP-Referer: "https://github.com/dixieflatline76/nacho-flow"
      X-Title: "nacho-flow"

# Heat Seeker: Live Model Deals & Discovery (v0.8.0)
deals:
  enabled: true
  alert_threshold_pct: 30.0    # Minimum discount % relative to benchmark ($3.00/1M) to qualify as a deal
  min_coding_index: 40.0       # Minimum Artificial Analysis coding benchmark score (or curated equivalent)
  require_tools: true          # Ensure discounted models support structured tool/function calling

# Dynamic Tiers evaluated sequentially using expr-lang/expr syntax (First Match Wins)
tiers:
  # Tier 1 (High Precedence): Multimodal Vision (Screenshots / UI mockups)
  - name: "Tier 1: Cloud Vision"
    provider: "openrouter"
    model: "google/gemini-2.5-flash-lite"
    when: "HasImages"

  # Tier 2: Local GPU (100% Free for quick tasks, single-file edits, and low context)
  - name: "Tier 2: Local GPU Free (Gemma 4 12B QAT)"
    provider: "ollama"
    model: "gemma4:12b-it-qat"
    when: "Tokens < 16000 && !HasImages && Retries == 0"
    strip_images: true
    max_context: 64000

  # Tier 2: Frontier-Grade Cloud Workhorse (Gemini 3.7 Flash Thinking)
  - name: "Tier 2: Cloud Workhorse (Gemini 3.7 Flash)"
    provider: "openrouter"
    model: "google/gemini-3.7-flash"
    when: "Retries < 1"

# Default Tier: Frontier Rescue for Complex Architecture, Infinite Loop Breaks, & Retries >= 2
default_tier:
  name: "Tier 4: Frontier Rescue (Claude Sonnet 5)"
  provider: "openrouter"
  model: "anthropic/claude-sonnet-5"
  when: "true"
