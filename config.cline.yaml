# =============================================================================
# 🌮 NACHO FLOW: CLINE-OPTIMIZED CONFIGURATION
# Tuned for Cline / Roo Code's diff-based edit architecture (SdkDiffEditCoordinator)
#
# KEY DIFFERENCES FROM DEFAULT (Zoo Code) CONFIG:
#   - Lower local token threshold (10000 vs 16000) to escalate before diffs
#   - Relaxed Cycle Killer prose/thinking limits for Cline's XML tool format
#   - HasToolProgress guard prevents local routing once file edits begin
#
# USAGE: nacho-flow -config config.cline.yaml
# =============================================================================

port: 8000

# =============================================================================
# 🔌 LLM PROVIDERS
# =============================================================================
providers:
  # ---------------------------------------------------------------------------
  # 1. Local GPU Provider (Ollama / vLLM / SGLang)
  # - Cost: $0.00 / 1M Tokens (100% Free Local Compute)
  # ---------------------------------------------------------------------------
  ollama:
    base_url: "http://127.0.0.1:11434"
    type: "local"

  # ---------------------------------------------------------------------------
  # 2. OpenRouter Cloud Gateway
  # - Role: Global routing to 300+ frontier and open-weight cloud models.
  # - Secret: Resolves ENV_OPENROUTER_API_KEY from environment.
  # ---------------------------------------------------------------------------
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: "ENV_OPENROUTER_API_KEY"
    type: "cloud"
    headers:
      HTTP-Referer: "https://github.com/dixieflatline76/nacho-flow"
      X-Title: "nacho-flow"

# =============================================================================
# 🔥 HEATSEEKER LIVE MODEL DEALS
# =============================================================================
deals:
  enabled: true
  alert_threshold_pct: 30.0
  min_coding_index: 40.0
  require_tools: true

# =============================================================================
# 🛡️ AGENTIC TOOL FALLBACK SHIELD
# =============================================================================
agent_shield:
  enabled: true
  tail_buffer_bytes: 256
  question_heuristics:
    - "are you satisfied"
    - "would you like"
    - "should i"
    - "do you approve"
    - "please confirm"
    - "let me know if"
    - "how would you like to proceed"
  mode_switch_heuristics:
    - "switch to code mode"
    - "switch to architect mode"
    - "ready to implement"
  error_signatures:
    - "[ERROR] You did not use a tool"
    - "Missing value for required parameter"
    - "The tool execution failed"
    - "<error_details>"
    - "No sufficiently similar match found"
    - "Command failed with exit code"
    - "Please retry with complete response"
    - "Editor operation failed"
    - "Parameter `old_text` is required"
    - "Parameter old_text is required"
    - "Command not executed:"

# =============================================================================
# 🎸 CYCLE KILLER — CLINE-TUNED
# Cline embeds tool calls as XML inside prose, so models legitimately produce
# longer prose blocks before tool tags appear. These limits are relaxed vs
# the Zoo Code defaults to avoid false-positive stream severing.
# =============================================================================
cycle_killer:
  enabled: true
  max_prose_tokens: 6144       # Zoo Code default: 4096. Cline XML needs more room.
  max_thinking_tokens: 2000    # Zoo Code default: 1500. Extra planning runway.
  repetition_window: 6
  repetition_threshold: 4      # Zoo Code default: 3. Cline XML is naturally repetitive.
  thinking_repetition_threshold: 6  # Zoo Code default: 5.
  max_retries: 1

# =============================================================================
# 🚦 ORDERED DYNAMIC ROUTING TIERS (FIRST MATCH WINS)
# =============================================================================
tiers:
  # ---------------------------------------------------------------------------
  # TIER 1: Local GPU Free (Devstral Small 2 24B 16k) - 100% VRAM Offload
  # Normal coding, planning, file creation, and 1st local self-heal retry.
  # ---------------------------------------------------------------------------
  - name: "Tier 1: Local GPU Free (Devstral Small 2 24B 16k)"
    provider: "ollama"
    model: "devstral-small-2:16k"
    when: "Tokens < 12000 && Retries < 2"
    strip_images: false
    max_context: 64000

  # ---------------------------------------------------------------------------
  # TIER 2: Deep Coding Workhorse (DeepSeek V4 Pro - 78.4% SWE-bench)
  # Handles diff repairs and heavy code synthesis under 64k context at $0.40/$1.20.
  # ---------------------------------------------------------------------------
  - name: "Tier 2: Deep Coding Workhorse (DeepSeek V4 Pro)"
    provider: "openrouter"
    model: "deepseek/deepseek-chat"
    when: "Tokens < 64000 && Retries < 4"

  # ---------------------------------------------------------------------------
  # TIER 3: Massive Context Workhorse (Gemini 3.7 Flash - 1M Context Window)
  # Swallows massive logs, full repos, and long histories in 2 seconds.
  # ---------------------------------------------------------------------------
  - name: "Tier 3: Massive Context Workhorse (Gemini 3.7 Flash)"
    provider: "openrouter"
    model: "google/gemini-3.7-flash"
    when: "Retries < 6"

  # ---------------------------------------------------------------------------
  # TIER 4: Frontier Powerhouse (Claude Sonnet 5 - Deep Architecture)
  # Deep architectural refactoring and complex multi-module logic mismatches.
  # ---------------------------------------------------------------------------
  - name: "Tier 4: Frontier Powerhouse (Claude Sonnet 5)"
    provider: "openrouter"
    model: "anthropic/claude-sonnet-5"
    when: "Retries < 8"

# =============================================================================
# 🛡️ DEFAULT TIER: The Final Arbiter (Claude Opus 5 - ~97% SWE-bench)
# Catastrophic disaster recovery for impossible edge cases.
# =============================================================================
default_tier:
  name: "Tier 5: The Final Arbiter (Claude Opus 5)"
  provider: "openrouter"
  model: "anthropic/claude-opus-5"
  when: "true"

