# =============================================================================
# 🌮 NACHO FLOW CONFIGURATION — ZOO CODE OPTIMIZED
# Zoo Code uses OpenAI-compatible JSON function calling, which Gemma 4 handles
# natively. Local GPU is the primary workhorse, cloud is pure fallback.
# =============================================================================
# USAGE: cp config.zoo.yaml config.yaml && kill -HUP $(pgrep nacho-flow)
# =============================================================================

port: 8000

# =============================================================================
# 🔌 LLM PROVIDERS
# =============================================================================
providers:
  ollama:
    base_url: "http://127.0.0.1:11434"
    type: "local"

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: "ENV_OPENROUTER_API_KEY"
    type: "cloud"
    headers:
      HTTP-Referer: "https://github.com/dixieflatline76/nacho-flow"
      X-Title: "nacho-flow"

# =============================================================================
# 🔥 HEATSEEKER LIVE MODEL DEALS
# =============================================================================
deals:
  enabled: true
  alert_threshold_pct: 30.0
  min_coding_index: 40.0
  require_tools: true

# =============================================================================
# 🛡️ AGENTIC TOOL FALLBACK SHIELD
# =============================================================================
agent_shield:
  enabled: true
  tail_buffer_bytes: 256
  question_heuristics:
    - "are you satisfied"
    - "would you like"
    - "should i"
    - "do you approve"
    - "please confirm"
    - "let me know if"
    - "how would you like to proceed"
  mode_switch_heuristics:
    - "switch to code mode"
    - "switch to architect mode"
    - "ready to implement"
  error_signatures:
    - "[ERROR] You did not use a tool"
    - "Missing value for required parameter"
    - "The tool execution failed"
    - "<error_details>"
    - "No sufficiently similar match found"
    - "Command failed with exit code"
    - "Please retry with complete response"
    - "Editor operation failed"
    - "Parameter `old_text` is required"
    - "Parameter old_text is required"
    - "Command not executed:"

# =============================================================================
# 🎸 CYCLE KILLER (Qu'est-ce que c'est?)
# In-Flight Stream Defense that murders infinite loops & monologue traps in <3s
# =============================================================================
cycle_killer:
  enabled: true                     # Master switch for all in-flight stream defense
  max_prose_tokens: 4096            # Max non-tool prose before intervention (<think> is exempt)
  max_thinking_tokens: 4096         # Max reasoning tokens before repetition enforcement kicks in
  repetition_window: 6              # Sliding n-gram window size (words) for loop detection
  repetition_threshold: 3           # Kill stream if same n-gram repeats this many times
  thinking_repetition_threshold: 5  # Same, but for <think> reasoning blocks (higher = more lenient)
  max_retries: 1                    # Stage 1 local retries with [SYSTEM OVERRIDE] before cloud escalation
  model_cooldown_seconds: 120       # 🧊 Model Cooldown: skip cycle-killed model on this session for 2m
  retry_floor: 3                    # 📈 Auto-Escalation: jump session retries to 3 on severed streams
  kickstart_threshold: 5            # ⚡ Kickstart: jolt after N idle turns without tool progress (0 = off)
  kickstart_max_count: 10           # 🛑 Kickstart Cap: force-escalate to default tier after N kickstarts
  kickstart_max_failures: 3         # 🔌 Circuit Breaker: suppress [SYSTEM OVERRIDE] after N consecutive model failures to produce tool calls
  kickstart_write_only: true        # Only count file writes / commands as progress (ignores read-only tools)
  kickstart_write_tools:            # Tools that count as "real progress" (read-only tools are ignored)
    - write_to_file
    - replace_in_file
    - replace_file_content
    - multi_replace_file_content
    - execute_command
    - apply_diff
    - insert_code_block
    - create_file
    - create_or_update_file
    - write_file
    - edit_file
    - delete_file
    - patch_file
    - run_command
    - run_terminal_command
    - terminal
    - bash
    - exec

# =============================================================================
# 🚦 ORDERED DYNAMIC ROUTING TIERS (FIRST MATCH WINS)
# =============================================================================
# KEY DIFFERENCE FROM CLINE CONFIG:
# Zoo Code uses OpenAI JSON function calling → Gemma 4 handles it natively.
# Gemma gets 3 retries (not 2) and a higher token ceiling because its tool
# calls actually work here. Cloud tiers are pure escalation fallbacks.
# =============================================================================
tiers:
  # ---------------------------------------------------------------------------
  # ⚡ KICKSTART ESCALATION: Break read-only idle loops with a smarter model
  # Switched to Gemini 3.7 Flash: ESM-correct, fast, handles 200k context.
  # ---------------------------------------------------------------------------
  - name: "Kickstart Escalation (Gemini 3.7 Flash)"
    provider: "openrouter"
    model: "google/gemini-3.7-flash"
    when: "SessionKickstarted && Retries < 3"

  # ---------------------------------------------------------------------------
  # TIER 1: Local GPU Workhorse (Gemma 4 12B QAT) - 100% VRAM Offload
  # ---------------------------------------------------------------------------
  - name: "Tier 1: Local GPU Workhorse"
    provider: "ollama"
    model: "gemma4:12b-it-qat"
    when: "Tokens < 16000 && Retries < 2"
    strip_images: false
    max_context: 32000

  # ---------------------------------------------------------------------------
  # TIER 2: Cloud Workhorse (Gemini 3.7 Flash)
  # Primary cloud coding tier. Handles Turn 1 (~18k tokens) and all turns up to 100k.
  # ---------------------------------------------------------------------------
  - name: "Tier 2: Cloud Workhorse (Gemini 3.7 Flash)"
    provider: "openrouter"
    model: "google/gemini-3.7-flash"
    when: "Tokens < 100000 && Retries < 4"

  # ---------------------------------------------------------------------------
  # TIER 3: Large Context Synthesis (Gemini 3.1 Pro)
  # ---------------------------------------------------------------------------
  - name: "Tier 3: Large Context Synthesis (Gemini 3.1 Pro)"
    provider: "openrouter"
    model: "google/gemini-3.1-pro-preview"
    when: "Retries < 6"

  # ---------------------------------------------------------------------------
  # TIER 4: Frontier Powerhouse (Claude Sonnet 5)
  # ---------------------------------------------------------------------------
  - name: "Tier 4: Frontier Powerhouse (Claude Sonnet 5)"
    provider: "openrouter"
    model: "anthropic/claude-sonnet-5"
    when: "Retries < 8"

  # ---------------------------------------------------------------------------
  # TIER 5: Claude Opus 5 — SPICY DIRECTIVE ONLY (unreachable by routing)
  # Opus is never auto-selected. Access via: X-Spicy-Model: anthropic/claude-opus-5
  # Also invoked by Fairy Dusting (Strategic Architecture Review, max 2/session).
  # ---------------------------------------------------------------------------
  - name: "Tier 5: Opus On-Demand (Spicy Only)"
    provider: "openrouter"
    model: "anthropic/claude-opus-5"
    when: "false"

# =============================================================================
# 🛡️ DEFAULT TIER: Cost-Safe Catch-All (Claude Sonnet 5)
# Sonnet at $3/$15 per 1M is the safety net. Opus is available via Fairy Dust
# (Strategic Architecture Review, max 2/session) & 🌶️ Spicy directive only.
# =============================================================================
default_tier:
  name: "Default: Cost-Safe Catch-All (Claude Sonnet 5)"
  provider: "openrouter"
  model: "anthropic/claude-sonnet-5"
  when: "true"

# =============================================================================
# FAIRY DUSTING - Proactive Frontier Quality Checkpoints
# Periodically routes a turn to a frontier model for a layered quality review.
# Multiple independent entries fire at their own cadence; highest priority wins
# when two entries trigger on the same write-progress turn.
# =============================================================================
fairy_dust:
  enabled: true
  entries:
    # -------------------------------------------------------------------------
    # Tactical Code Review (Claude Sonnet 5)
    # Frequent, cost-effective checks for concrete bugs, type errors, ESM issues.
    # At frequency=15 with ~90 write turns per run -> fires ~6 times.
    # -------------------------------------------------------------------------
    - name: "Tactical Code Review"
      model: "anthropic/claude-sonnet-5"
      provider: "openrouter"
      frequency: 15
      max_per_session: 5
      priority: 10
      prompt: >
        [QUALITY CHECKPOINT - Tactical Review] You are a senior code reviewer
        consulted mid-flight. Analyze the current codebase for: (1) logic bugs
        and incorrect calculations, (2) TypeScript/ESM compilation errors (missing
        .js extensions, type mismatches, missing imports), (3) test failures or
        broken assertions. Fix any issues immediately with tool calls. If
        everything looks correct, confirm and continue the current task.

    # -------------------------------------------------------------------------
    # Strategic Architecture Review (Claude Opus 5)
    # Rare, deep review of overall direction and requirement alignment.
    # At frequency=40 with ~90 write turns per run -> fires ~2 times.
    # -------------------------------------------------------------------------
    - name: "Strategic Architecture Review"
      model: "anthropic/claude-opus-5"
      provider: "openrouter"
      frequency: 40
      max_per_session: 2
      priority: 100
      prompt: >
        [QUALITY CHECKPOINT - Architecture Review] You are the lead architect
        consulted for a strategic review. Evaluate: (1) Is the agent solving the
        RIGHT problem? Compare current work against the original requirements.
        (2) Is the overall architecture sound, or has it drifted into unnecessary
        complexity? (3) Are there systemic issues (wrong patterns, missing
        abstractions, repeated mistakes) that tactical fixes won't solve? If you
        identify strategic drift, restructure the approach. If the trajectory is
        correct, confirm the direction and continue.
