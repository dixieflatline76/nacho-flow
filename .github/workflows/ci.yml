name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published, released]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Lint & Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      - name: Run Go unit tests
        run: go test -v ./...

      - name: Run VS Code extension unit tests
        run: |
          cd extension
          npm ci
          npm test

      - name: Dry Run Build
        run: go build -o bin/nacho-flow ./cmd/nacho-flow

      - name: Test Universal Installer Script
        if: runner.os != 'Windows'
        run: bash scripts/install_test.sh

  build-linux:
    name: Build Linux Binaries & VSIXs
    runs-on: ubuntu-latest
    if: github.event.action == 'published'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      - name: Run Linux Tests
        run: go test -v ./...

      - name: Build Linux Binaries (amd64 & arm64)
        run: |
          VERSION=$(cat version.txt | tr -d '\r\n')
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/nacho-flow-${VERSION}-linux-amd64" ./cmd/nacho-flow
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/nacho-flow-${VERSION}-linux-arm64" ./cmd/nacho-flow

      - name: Package Linux VSIXs (x64 & arm64)
        run: |
          VERSION=$(cat version.txt | tr -d '\r\n')
          cd extension
          npm ci
          npm run compile
          node esbuild.config.js
          mkdir -p bin
          
          # Package linux-x64 VSIX
          cp "../dist/nacho-flow-${VERSION}-linux-amd64" bin/nacho-flow
          chmod +x bin/nacho-flow
          npx vsce package --target linux-x64 --no-dependencies --out "../dist/nacho-flow-${VERSION}-linux-x64.vsix"
          
          # Package linux-arm64 VSIX
          cp "../dist/nacho-flow-${VERSION}-linux-arm64" bin/nacho-flow
          chmod +x bin/nacho-flow
          npx vsce package --target linux-arm64 --no-dependencies --out "../dist/nacho-flow-${VERSION}-linux-arm64.vsix"
          rm -rf bin

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nacho-linux-artifacts
          path: dist/

  build-win:
    name: Build Windows Binary & VSIX
    runs-on: windows-latest
    if: github.event.action == 'published'
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      - name: Build Windows Executable
        run: |
          $version = (Get-Content version.txt).Trim()
          New-Item -ItemType Directory -Force -Path dist
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          go build -ldflags="-s -w -X main.version=$version" -o "dist/nacho-flow-${version}-windows-amd64.exe" ./cmd/nacho-flow

      - name: Sign Executable (Azure Trusted Signing)
        if: env.AZURE_TENANT_ID != ''
        uses: azure/artifact-signing-action@v1.2.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: SpiceOSS
          certificate-profile-name: Spice
          files: |
            ${{ github.workspace }}\dist\*.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package Windows VSIX (win32-x64)
        run: |
          $version = (Get-Content version.txt).Trim()
          cd extension
          npm ci
          npm run compile
          node esbuild.config.js
          New-Item -ItemType Directory -Force -Path bin
          Copy-Item "../dist/nacho-flow-${version}-windows-amd64.exe" -Destination "bin/nacho-flow.exe"
          npx vsce package --target win32-x64 --no-dependencies --out "../dist/nacho-flow-${version}-win32-x64.vsix"
          Remove-Item -Force -Recurse bin
        shell: pwsh

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nacho-win-artifacts
          path: dist/

  build-mac:
    name: Build macOS Binaries & VSIXs
    runs-on: macos-latest
    if: github.event.action == 'published'
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      - name: Import Apple Certificates
        if: env.MACOS_CERTIFICATE != ''
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
          security create-keychain -p "${{ runner.temp }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ runner.temp }}" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "${{ runner.temp }}" -s build.keychain
          rm -f certificate.p12

      - name: Build & Sign macOS Binaries
        env:
          SIGNING_IDENTITY: "Developer ID Application: Karl Kwong (T96W95GY4U)"
        run: |
          VERSION=$(cat version.txt | tr -d '\r\n')
          mkdir -p dist
          
          # ARM64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/nacho-flow-${VERSION}-darwin-arm64" ./cmd/nacho-flow
          
          # AMD64 (Intel)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/nacho-flow-${VERSION}-darwin-amd64" ./cmd/nacho-flow

          if [ -n "${{ secrets.MACOS_CERTIFICATE }}" ]; then
            codesign --force --options=runtime --sign "${SIGNING_IDENTITY}" --timestamp "dist/nacho-flow-${VERSION}-darwin-arm64"
            codesign --force --options=runtime --sign "${SIGNING_IDENTITY}" --timestamp "dist/nacho-flow-${VERSION}-darwin-amd64"
          fi

      - name: Package macOS VSIXs (darwin-arm64 & darwin-x64)
        run: |
          VERSION=$(cat version.txt | tr -d '\r\n')
          cd extension
          npm ci
          npm run compile
          node esbuild.config.js
          mkdir -p bin
          
          # Package darwin-arm64 VSIX
          cp "../dist/nacho-flow-${VERSION}-darwin-arm64" bin/nacho-flow
          chmod +x bin/nacho-flow
          npx vsce package --target darwin-arm64 --no-dependencies --out "../dist/nacho-flow-${VERSION}-darwin-arm64.vsix"
          
          # Package darwin-x64 VSIX
          cp "../dist/nacho-flow-${VERSION}-darwin-amd64" bin/nacho-flow
          chmod +x bin/nacho-flow
          npx vsce package --target darwin-x64 --no-dependencies --out "../dist/nacho-flow-${VERSION}-darwin-x64.vsix"
          rm -rf bin

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nacho-mac-artifacts
          path: dist/

  publish-release:
    name: Publish Release (Upload Assets)
    runs-on: ubuntu-latest
    needs: [build-win, build-mac, build-linux]
    if: github.event.action == 'published'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nacho-win-artifacts
          path: dist

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nacho-mac-artifacts
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nacho-linux-artifacts
          path: dist

      - name: Run Nacho Releaser (Upload Binaries & Checksums)
        run: go run cmd/util/nacho_releaser/main.go
        env:
          NACHO_RELEASER_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SKIP_DISTRIBUTION: ${{ github.event.release.prerelease }}

  distribute-release:
    name: Distribute (Prerelease Promotion to Latest)
    runs-on: windows-latest
    if: github.event.action == 'released' && github.event.release.prerelease == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Release Assets
        run: |
          $tagName = '${{ github.event.release.tag_name }}'
          New-Item -ItemType Directory -Force -Path dist
          gh release download $tagName --pattern "nacho-flow-*" --dir dist
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Run Nacho Releaser (Sync Winget Manifests)
        run: go run cmd/util/nacho_releaser/main.go
        env:
          NACHO_RELEASER_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SKIP_DISTRIBUTION: "false"

  publish-docker:
    name: Publish Multi-Arch Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: [publish-release]
    if: github.event_name == 'release' && (github.event.action == 'published' || github.event.action == 'released')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
