name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - 'ROADMAP.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Site Distribution
        run: |
          mkdir -p site/docs
          cp docs/*.md site/docs/
          cp ROADMAP.md site/ROADMAP.md
          VERSION=$(cat version.txt | tr -d '[:space:]')
          sed -i "s/class=\"logo-badge logo-badge-version\" id=\"version-badge\">[^<]*/class=\"logo-badge logo-badge-version\" id=\"version-badge\">v$VERSION/g" site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
