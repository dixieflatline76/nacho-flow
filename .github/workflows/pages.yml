name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - 'ROADMAP.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Site Distribution
        run: |
          mkdir -p site/docs
          cp -r docs/* site/docs/
          mkdir -p site/benchmarks
          cp -r docs/benchmarks/* site/benchmarks/ 2>/dev/null || true
          mkdir -p site/images
          cp -r images/* site/images/ 2>/dev/null || true
          cp ROADMAP.md site/ROADMAP.md
          cp version.txt site/version.txt
          VERSION=$(cat version.txt | tr -d '[:space:]')
          sed -i "s/class=\"logo-badge logo-badge-version\" id=\"version-badge\">[^<]*/class=\"logo-badge logo-badge-version\" id=\"version-badge\">v$VERSION/g" site/index.html
          sed -i "s/{{VERSION}}/$VERSION/g" site/docs/*.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
