# =============================================================================
# 🌮 NACHO FLOW CONFIGURATION — PROFILE 3: ANTHROPIC NATIVE BENCHMARK
# Turn 0 Plan: Sonnet 5.5 -> Workhorse: Haiku 5.5 -> Escalations: Sonnet 5.5 -> Opus 5.5
# =============================================================================
version: "1.1.0"
port: 8000
host: "127.0.0.1"

# =============================================================================
# 🔌 LLM PROVIDERS (ANTHROPIC DIRECT)
# =============================================================================
providers:
  anthropic:
    type: "anthropic"
    api_key: "ENV_ANTHROPIC_API_KEY"

# =============================================================================
# 🔥 HEATSEEKER LIVE MODEL DEALS (Disabled for native direct provider)
# =============================================================================
deals:
  enabled: false

# =============================================================================
# 🛡️ AGENTIC TOOL FALLBACK SHIELD
# =============================================================================
agent_shield:
  enabled: true
  tail_buffer_bytes: 256

# =============================================================================
# 🎸 CYCLE KILLER (In-flight stream defense)
# =============================================================================
cycle_killer:
  enabled: true
  phrase_length: 6
  budget_max_repeats: 5
  model_cooldown_seconds: 120
  retry_floor: 3
  max_retries: 1

  thinking_lane:
    max_tokens: 16384
    max_repeats: 6

  content_lane:
    max_tokens: 8192
    max_repeats: 8

  tool_lane:
    max_tokens: 16384
    max_write_tokens: 65536
    phrase_length: 4
    max_repeats: 8

kickstart:
  read_slap:
    enabled: true                     # ⚡ Master switch for cross-turn idle session resuscitation
    threshold: 5                      # Jolt with [SYSTEM OVERRIDE] after N consecutive idle turns (0 = off)
    max_slaps: 10                     # 🛑 Read Slap Cap: force-escalate to default tier after N slaps
    max_failures: 3                   # 🔌 Circuit Breaker: suppress injection after N consecutive model failures
    write_only: true                  # Only count file writes / commands as progress (ignores read-only tools)

  thought_slap:
    max_attempts: 1                   # Max recovery attempts per turn (1..3)
    rescue_tier: "Tier 1: Haiku 5.5 (low reasoning)"

# =============================================================================
# 🗜️ NACHO TOKEN SAVER (NTS)
# Wire-speed, zero-allocation in-place tool output compaction engine
# =============================================================================
nts:
  enabled: true                     # Master switch for tool output compaction
  strip_ansi: true                  # Pass 1: Strip ANSI & OSC escape sequences
  resolve_cr: true                  # Pass 2: Overwrite carriage returns from progress spinners
  normalize_whitespace: true        # Pass 3: Collapse multiple empty lines
  preserve_file_reads: true         # 🛡️ Dual-lane immunity for read_file / view_file
  preserve_file_writes: true        # 🛡️ Dual-lane immunity for write_to_file / apply_diff
  preserve_cache_control: true      # 🛡️ Dual-lane immunity for prompt cache breakpoints
  strip_historical_reasoning: true  # 🧠 Prune older assistant reasoning/thoughts from prior turns
  keep_recent_reasoning_turns: 3    # 🛡️ Keep the 3 most recent assistant turns intact to prevent amnesia
  deduplicate_reminders: true       # 📋 Deduplicate repeated reminder tables in <environment_details>
  reminders_refresh_interval: 10    # 📋 Re-emit full reminders table every 10 turns
  collapse_verbose_tests: true      # 🧪 Multi-language test collapse (Go, Cargo, Pytest, Jest)
  deduplicate_tool_outputs: true    # 🔁 Deduplicate identical generic tool outputs (>200 B)
  min_duplicate_output_bytes: 200   # 🔁 Minimum output length in bytes for duplicate referencing

# =============================================================================
# 🚦 ORDERED DYNAMIC ROUTING TIERS
# =============================================================================
tiers:
  # ---------------------------------------------------------------------------
  # 🎯 TURN 0 ARCHITECT: Kickoff Architecture & Planning with Sonnet 5.5
  # ---------------------------------------------------------------------------
  - name: "Turn 0 Architecture Kickoff (Claude Sonnet 5.5)"
    provider: "anthropic"
    model: "claude-sonnet-5-5"
    reasoning_effort: "medium"
    when: "MessageCount <= 6"

  # ---------------------------------------------------------------------------
  # TIER 1: Claude Haiku 5.5 (Fast & Ultra-Cheap Workhorse: $0.10 / $0.50 MTok)
  # Clean development turns only (< 2 retries and no failing test suites)
  # ---------------------------------------------------------------------------
  - name: "Tier 1: Haiku 5.5 (low reasoning)"
    provider: "anthropic"
    model: "claude-haiku-5-5"
    reasoning_effort: "low"
    when: "Retries < 2 && !HasTestFail"

  # ---------------------------------------------------------------------------
  # TIER 1.5: Claude Haiku 5.5 (Medium Reasoning Escalation)
  # Clean development turns only (< 4 retries and no failing test suites)
  # ---------------------------------------------------------------------------
  - name: "Tier 1: Haiku 5.5 (medium reasoning)"
    provider: "anthropic"
    model: "claude-haiku-5-5"
    reasoning_effort: "medium"
    when: "Retries < 4 && !HasTestFail"

  # ---------------------------------------------------------------------------
  # TIER 2: Claude Sonnet 5.5 (Primary Escalation: $2 / $10 MTok)
  # Escalates when Haiku hits errors or retries (2 <= Retries < 6)
  # ---------------------------------------------------------------------------
  - name: "Tier 2: Claude Sonnet 5.5 (Escalation)"
    provider: "anthropic"
    model: "claude-sonnet-5-5"
    reasoning_effort: "medium"
    when: "Retries < 6"

  # ---------------------------------------------------------------------------
  # TIER 3: Claude Sonnet 5.5 High Reasoning (Deep Debugging Escalation)
  # Escalates to maximum thinking depth on stubborn failure loops (Retries >= 6)
  # Replaces Opus 5.5 to deliver deep reasoning at 80% lower cost
  # ---------------------------------------------------------------------------
  - name: "Tier 3: Claude Sonnet 5.5 (High Reasoning Escalation)"
    provider: "anthropic"
    model: "claude-sonnet-5-5"
    reasoning_effort: "high"
    when: "Retries >= 6"

  # ---------------------------------------------------------------------------
  # TIER 4: Claude Opus 5.5 (Frontier Powerhouse / Manual Override Only)
  # Kept dormant (when: "false") to prevent autonomous billing spikes
  # Available via HotSauce directives: @nacho:tier="Tier 4: Claude Opus 5.5"
  # ---------------------------------------------------------------------------
  - name: "Tier 4: Claude Opus 5.5 (Nuclear Option)"
    provider: "anthropic"
    model: "claude-opus-5-5"
    reasoning_effort: "medium"
    when: "false"

# =============================================================================
# 🛡️ DEFAULT TIER: Catch-All (Claude Sonnet 5.5)
# =============================================================================
default_tier:
  name: "Default: Claude Sonnet 5.5"
  provider: "anthropic"
  model: "claude-sonnet-5-5"
  reasoning_effort: "medium"
  when: "true"

# =============================================================================
# 🧚 FAIRY DUSTING (Disabled for pure direct pipeline testing)
# =============================================================================
fairy_dust:
  enabled: false
