# =============================================================================
# 🌮 NACHO FLOW CONFIGURATION — PROFILE 2: ANTHROPIC NATIVE BENCHMARK
# Turn 0 Plan: Claude Sonnet 5.5 -> Workhorse: Claude Haiku 4.5 -> Escalations: Claude Sonnet 5.5 -> Claude Opus 5.5
# =============================================================================
version: "1.1.0"
port: 8000                          # HTTP proxy listening port for incoming agent requests
host: "127.0.0.1"                   # Bind address (127.0.0.1 for local isolation, 0.0.0.0 for LAN access)

# =============================================================================
# 🔌 LLM PROVIDERS (ANTHROPIC DIRECT)
# Direct native connection to Anthropic Messages API without third-party aggregators.
# =============================================================================
providers:
  anthropic:
    base_url: "https://api.anthropic.com"   # API base endpoint URL for native Anthropic Messages API
    api_key: "ENV_ANTHROPIC_API_KEY"        # Environment variable holding your Anthropic API key
    type: "anthropic"                      # Provider execution classification: "anthropic" (native format)

# =============================================================================
# 🔥 HEATSEEKER LIVE MODEL DEALS (Disabled for native direct provider)
# =============================================================================
deals:
  enabled: false                    # Master switch for dynamic deal discovery (disabled for direct provider testing)

# =============================================================================
# 🛡️ AGENTIC TOOL FALLBACK SHIELD
# Streaming parser guard that repairs malformed tool calls, catches conversational loops,
# and enforces strict tool protocol execution across diverse models.
# =============================================================================
agent_shield:
  enabled: true                     # Master switch for agentic tool schema protection and fallback parsing
  tail_buffer_bytes: 256            # Rolling byte window scanned at the end of streaming chunks for early error/question detection

# =============================================================================
# 🎸 CYCLE KILLER (In-Flight Stream Defense)
# Wire-speed streaming defense that detects and terminates infinite repetition loops,
# monologues, and spinning tool invocations in real time.
# =============================================================================
cycle_killer:
  enabled: true                     # Master switch for real-time in-flight stream repetition defense
  phrase_length: 6                  # Default sliding n-gram window size (in words) used to detect repeating phrases
  budget_max_repeats: 5             # Repetition tolerance threshold applied once a lane exceeds its token budget
  model_cooldown_seconds: 120       # Cooldown duration in seconds to bypass a cycle-killed model on this session
  retry_floor: 3                    # Minimum retry level assigned to the session upon stream termination to trigger escalation
  max_retries: 1                    # Maximum local retries with injection override before escalating to a higher tier

  thinking_lane:
    max_tokens: 16384               # Maximum reasoning/thinking tokens allowed before budget repetition checks apply
    max_repeats: 6                  # Immediate repetition threshold (Type 1 fast kill) for duplicate reasoning phrases

  content_lane:
    max_tokens: 8192                # Maximum conversational prose tokens allowed before budget repetition checks apply
    max_repeats: 8                  # Immediate repetition threshold (Type 1 fast kill) for prose content

  tool_lane:
    max_tokens: 16384               # Maximum streaming token budget for tool call invocations and arguments
    max_write_tokens: 65536         # Dedicated token ceiling for high-volume file writing operations (zero-alloc fast path)
    phrase_length: 4                # Tighter n-gram window to detect repeating short shell commands or arguments
    max_repeats: 8                  # Immediate repetition threshold (Type 1 fast kill) for duplicate tool invocations

# =============================================================================
# ⚡ KICKSTART ESCALATION
# Cross-turn idle session resuscitation that detects stalled agents trapped in
# read-only loops (e.g. repeated file viewing without progress) and injects action overrides.
# =============================================================================
kickstart:
  read_slap:
    enabled: true                     # Master switch for cross-turn idle session resuscitation
    threshold: 5                      # Number of consecutive idle/read-only turns before injecting a system override
    max_slaps: 10                     # Maximum read slaps allowed before force-escalating to default tier
    max_failures: 3                   # Circuit breaker: temporarily suspend injection after N consecutive model failures
    write_only: true                  # Treat only state-changing actions (file writes, commands) as progress

# =============================================================================
# 🗜️ NACHO TOKEN SAVER (NTS)
# Wire-speed, zero-allocation in-place tool output compaction engine.
# Prunes redundant whitespace, ANSI noise, and stale history to preserve context space.
# =============================================================================
nts:
  enabled: true                     # Master switch for tool output compaction
  strip_ansi: true                  # Pass 1: Strip ANSI & OSC terminal escape sequences from command outputs
  resolve_cr: true                  # Pass 2: Overwrite carriage returns from progress spinners and progress bars
  normalize_whitespace: true        # Pass 3: Collapse consecutive empty lines into clean single line breaks
  preserve_file_reads: true         # Dual-lane immunity: preserve complete fidelity for read_file / view_file outputs
  preserve_file_writes: true        # Dual-lane immunity: preserve complete fidelity for write_to_file / apply_diff
  preserve_cache_control: true      # Dual-lane immunity: protect prompt cache breakpoints from compaction
  strip_historical_reasoning: true  # Prune chain-of-thought/reasoning blocks from older assistant turns
  keep_recent_reasoning_turns: 3    # Number of most recent assistant turns to keep reasoning intact for cognitive continuity
  deduplicate_reminders: true       # Deduplicate repeated reminder tables injected into environment details
  reminders_refresh_interval: 10    # Number of turns between full reminder table re-emissions
  collapse_verbose_tests: true      # Multi-language test collapse for Go, Cargo, Pytest, and Jest test outputs
  deduplicate_tool_outputs: true    # Deduplicate identical repeating generic tool outputs with back-references
  min_duplicate_output_bytes: 200   # Minimum tool output size in bytes required for duplicate back-referencing

# =============================================================================
# 🚦 ORDERED DYNAMIC ROUTING TIERS
# Evaluated top-to-bottom on every turn; first matching condition handles the request.
# =============================================================================
tiers:
  # ---------------------------------------------------------------------------
  # 🎯 TURN 0 ARCHITECT: Kickoff Architecture & Planning with Claude Sonnet 5.5
  # Engages Claude Sonnet 5.5 during initial turns to draft plans and project architecture.
  # ---------------------------------------------------------------------------
  - name: "Turn 0 Architecture Kickoff (Claude Sonnet 5.5)"
    provider: "anthropic"
    model: "claude-sonnet-5-5"
    reasoning_effort: "medium"
    when: "MessageCount <= 6"

  # ---------------------------------------------------------------------------
  # TIER 1: Claude Haiku 4.5 (Workhorse)
  # High-speed execution tier for clean development turns (< 2 retries and no failing test suites).
  # ---------------------------------------------------------------------------
  - name: "Tier 1: Claude Haiku 4.5 (Workhorse)"
    provider: "anthropic"
    model: "claude-haiku-4-5"
    reasoning_effort: "medium"
    when: "Retries < 2 && !HasTestFail"

  # ---------------------------------------------------------------------------
  # TIER 2: Claude Sonnet 5.5 (Escalation)
  # Primary escalation tier when Haiku encounters tool errors, unexpected outputs, or retries.
  # ---------------------------------------------------------------------------
  - name: "Tier 2: Claude Sonnet 5.5 (Escalation)"
    provider: "anthropic"
    model: "claude-sonnet-5-5"
    reasoning_effort: "medium"
    when: "Retries < 6"

  # ---------------------------------------------------------------------------
  # TIER 3: Claude Sonnet 5.5 High Reasoning (Deep Debugging Escalation)
  # Escalates to maximum thinking depth on stubborn failure loops (Retries >= 6)
  # for frontier problem solving and complex debugging.
  # ---------------------------------------------------------------------------
  - name: "Tier 3: Claude Sonnet 5.5 (High Reasoning Escalation)"
    provider: "anthropic"
    model: "claude-sonnet-5-5"
    reasoning_effort: "high"
    when: "Retries >= 6"

  # ---------------------------------------------------------------------------
  # TIER 4: Claude Opus 5.5 (Nuclear Option / Manual Override Only)
  # Kept dormant (when: "false") during autonomous execution to prevent unintended heavy usage.
  # Available via HotSauce directives: @nacho:tier="Tier 4: Claude Opus 5.5"
  # ---------------------------------------------------------------------------
  - name: "Tier 4: Claude Opus 5.5 (Nuclear Option)"
    provider: "anthropic"
    model: "claude-opus-5-5"
    reasoning_effort: "medium"
    when: "false"

# =============================================================================
# 🛡️ DEFAULT TIER: Catch-All (Claude Sonnet 5.5)
# Fallback tier selected if no conditional tier matches the request.
# =============================================================================
default_tier:
  name: "Default: Claude Sonnet 5.5"
  provider: "anthropic"
  model: "claude-sonnet-5-5"
  reasoning_effort: "medium"
  when: "true"

# =============================================================================
# 🧚 FAIRY DUSTING (Disabled for pure direct pipeline testing)
# =============================================================================
fairy_dust:
  enabled: false                    # Master switch for proactive quality checkpoints (disabled for direct testing)
